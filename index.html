<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Print - حاسبة أسعار علب الأدوية</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .section-title {
            font-size: 1.1rem;
            color: #0284c7;
            border-bottom: 2px solid #0284c7;
            padding-bottom: 5px;
            margin-top: 20px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }
        button {
            background-color: #1e3a8a;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 25px;
            font-weight: bold;
        }
        button:hover {
            background-color: #1e40af;
        }
        .result-box {
            margin-top: 25px;
            background: #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            border-right: 5px solid #0284c7;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 1.05rem;
        }
        .result-item span:last-child {
            font-weight: bold;
            color: #047857;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Classic Print</h1>
    <div class="subtitle">حاسبة تكاليف وأسعار عُلب الأدوية الأوتوماتيكية</div>

    <div class="section-title">1. مقاسات العلبة والكمية</div>
    <div class="grid">
        <div class="form-group">
            <label>طول العلبة (سم):</label>
            <input type="number" id="length" value="5" step="0.1">
        </div>
        <div class="form-group">
            <label>عرض العلبة (سم):</label>
            <input type="number" id="width" value="3" step="0.1">
        </div>
        <div class="form-group">
            <label>ارتفاع العلبة (سم):</label>
            <input type="number" id="height" value="10" step="0.1">
        </div>
        <div class="form-group">
            <label>الكمية المطلوبة (علبة):</label>
            <input type="number" id="quantity" value="5000">
        </div>
    </div>

    <div class="section-title">2. مقاس الفرخ والطباعة</div>
    <div class="grid">
        <div class="form-group">
            <label>عرض فرخ الورق (سم):</label>
            <input type="number" id="sheetWidth" value="70">
        </div>
        <div class="form-group">
            <label>طول فرخ الورق (سم):</label>
            <input type="number" id="sheetHeight" value="100">
        </div>
        <div class="form-group">
            <label>عدد الألوان:</label>
            <select id="colors">
                <option value="1">1 لون</option>
                <option value="2">2 لون</option>
                <option value="4" selected>4 ألوان (سبرنت)</option>
            </select>
        </div>
    </div>

    <div class="section-title">3. أسعار الخامات والتصنيع</div>
    <div class="grid">
        <div class="form-group">
            <label>سعر فرخ الورق (جنيه):</label>
            <input type="number" id="paperPrice" value="15">
        </div>
        <div class="form-group">
            <label>سعر طقم البليتات (CTP):</label>
            <input type="number" id="platePrice" value="400">
        </div>
        <div class="form-group">
            <label>طباعة 1000 فرخ (جنيه):</label>
            <input type="number" id="printPrice" value="250">
        </div>
        <div class="form-group">
            <label>تكسير ولزق للعلبة الواحدة:</label>
            <input type="number" id="finishingPrice" value="0.5" step="0.1">
        </div>
        <div class="form-group">
            <label>هامش الربح (%):</label>
            <input type="number" id="profitMargin" value="20">
        </div>
    </div>

    <button onclick="calculatePrice()">احسب التكلفة وسعر العلبة</button>

    <div class="result-box" id="resultSection" style="display: none;">
        <h3>النتائج:</h3>
        <div class="result-item">
            <span>عدد العلب التقديري في الفرخ:</span>
            <span id="resBoxesPerSheet">0 علبة</span>
        </div>
        <div class="result-item">
            <span>عدد الأفرخ المطلوبة (بالهالك 10%):</span>
            <span id="resSheets">0 فرخ</span>
        </div>
        <div class="result-item">
            <span>التكلفة الإجمالية للطلبية:</span>
            <span id="resTotalCost">0 ج.م</span>
        </div>
        <div class="result-item" style="border-top: 2px dashed #ccc; padding-top: 10px; margin-top: 10px;">
            <span>سعر بيع العلبة الواحدة:</span>
            <span id="resBoxPrice" style="color: #dc2626; font-size: 1.2rem;">0 ج.م</span>
        </div>
    </div>
</div>

<script>
function calculatePrice() {
    let l = parseFloat(document.getElementById('length').value) || 0;
    let w = parseFloat(document.getElementById('width').value) || 0;
    let h = parseFloat(document.getElementById('height').value) || 0;
    let qty = parseFloat(document.getElementById('quantity').value) || 0;

    let sW = parseFloat(document.getElementById('sheetWidth').value) || 70;
    let sH = parseFloat(document.getElementById('sheetHeight').value) || 100;

    let paperPrice = parseFloat(document.getElementById('paperPrice').value) || 0;
    let platePrice = parseFloat(document.getElementById('platePrice').value) || 0;
    let printPricePerThousand = parseFloat(document.getElementById('printPrice').value) || 0;
    let finishingPerBox = parseFloat(document.getElementById('finishingPrice').value) || 0;
    let profitMargin = parseFloat(document.getElementById('profitMargin').value) || 0;

    let unfoldedWidth = (l + w) * 2 + 1.5;
    let unfoldedHeight = h + w + 2;
    let boxArea = unfoldedWidth * unfoldedHeight;

    let sheetArea = sW * sH;
    let boxesPerSheet = Math.floor((sheetArea / boxArea) * 0.85);
    if (boxesPerSheet < 1) boxesPerSheet = 1;

    let rawSheets = qty / boxesPerSheet;
    let totalSheets = Math.ceil(rawSheets * 1.10);

    let paperTotalCost = totalSheets * paperPrice;
    let printingTotalCost = (totalSheets / 1000) * printPricePerThousand;
    let finishingTotalCost = qty * finishingPerBox;
    
    let baseCost = paperTotalCost + printingTotalCost + platePrice + finishingTotalCost;
    let finalTotalWithProfit = baseCost * (1 + (profitMargin / 100));
    let pricePerBox = finalTotalWithProfit / qty;

    document.getElementById('resBoxesPerSheet').innerText = boxesPerSheet + " علبة";
    document.getElementById('resSheets').innerText = totalSheets.toLocaleString() + " فرخ";
    document.getElementById('resTotalCost').innerText = finalTotalWithProfit.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " ج.م";
    document.getElementById('resBoxPrice').innerText = pricePerBox.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " ج.م";

    document.getElementById('resultSection').style.display = 'block';
}
</script>

</body>
</html>
